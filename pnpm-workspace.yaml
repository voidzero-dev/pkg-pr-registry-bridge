allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  better-sqlite3: false
# vite-plus, the @voidzero-dev/vite-plus-* packages, and vitest are excluded
# from pnpm's release-age cooldown. The local Renovate vite+ group proposes
# their bumps together and immediately, and this repo dogfoods fresh releases.
minimumReleaseAgeExclude:
  - void@0.10.5
  - vite-plus
  - '@voidzero-dev/vite-plus-*'
  - vitest
  - wrangler@4.136.3
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  '@cloudflare/vitest-plugin>miniflare': 5.20260921.0-alpha
  '@cloudflare/vitest-plugin>wrangler': 4.136.3
  '@cloudflare/workers-types@*': 5.20260921.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
