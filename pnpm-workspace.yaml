# pnpm 11 reads dependency build-script approvals here (the package.json `pnpm`
# field is no longer honored). esbuild bundles the publish action; workerd runs
# the Worker for tests/dev; sharp is a transitive dependency. better-sqlite3 is a
# transitive of Void's D1/Drizzle layer, which this bridge does not use, so its
# native build is skipped.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  better-sqlite3: false
# vite-plus and the @voidzero-dev/vite-plus-* packages are excluded from
# pnpm's release-age cooldown:
# Renovate's vite+ fast lane (github>Boshen/renovate) proposes their bumps
# immediately, and this repo dogfoods fresh Vite+ releases.
minimumReleaseAgeExclude:
  - void@0.10.5
  - vite-plus
  - '@voidzero-dev/vite-plus-*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
