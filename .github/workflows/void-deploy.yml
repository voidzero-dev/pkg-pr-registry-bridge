name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an in-flight deploy for the same branch.
concurrency:
  group: void-deploy-${{ github.ref }}
  cancel-in-progress: true

# `void deploy` authenticates via GitHub OIDC, so there is no long-lived
# VOID_TOKEN secret here: id-token lets the job mint an OIDC token that the
# CLI exchanges for a short-lived project-scoped deploy token. The Void
# platform only honors the exchange from `.github/workflows/void-deploy.yml`
# on a push to the connected branch, so this file must keep exactly that name.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (org policy); kept in sync with ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-vp installs vp (version resolved from the pnpm catalog), the
      # Node.js and pnpm pinned in devEngines, and the project dependencies,
      # with lockfile-keyed caching.
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true

      # Staging-first gate, even though PRs already smoke-test staging
      # (staging.yml), a change can still reach main without that check: a fork
      # PR can't read VOID_TOKEN, and direct pushes skip PR CI. So re-run the
      # staging deploy + smoke here and only ship to production when it passes.
      - name: Deploy to staging
        run: vp run deploy:staging

      # --write runs the admin write lifecycle too (see scripts/smoke-test.mjs
      # header); staging only, production smoke below stays read-only.
      - name: Smoke-test staging
        run: node scripts/smoke-test.mjs https://pkg-pr-registry-bridge-staging.void.app --write
        env:
          SMOKE_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}

      # Only reached when the staging smoke test passed.
      - name: Deploy to production
        run: vp run deploy:only
        env:
          # VOID_PROJECT is required because the project link in `.void/` is
          # gitignored, so there is nothing to resolve from in CI. The OIDC
          # exchange also scopes the deploy token to this slug.
          VOID_PROJECT: pkg-pr-registry-bridge

      # No --write: read-only against the live bridge.
      - name: Smoke-test production
        run: node scripts/smoke-test.mjs https://registry-bridge.viteplus.dev
