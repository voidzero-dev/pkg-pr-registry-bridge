name: Deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The staging environment is a single shared project, so PR runs serialize in
# one queue (never cancel another PR's deploy+smoke mid-flight). Pushes keep
# latest-wins semantics instead: a newer main commit cancels the in-flight
# deploy so an older commit can never overtake it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && 'void-staging' || format('void-deploy-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

# On push/dispatch `void deploy` authenticates via GitHub OIDC, so there is no
# long-lived VOID_TOKEN secret in those runs: id-token lets the job mint an
# OIDC token that the CLI exchanges for a short-lived project-scoped deploy
# token. The Void platform only honors the exchange from
# `.github/workflows/void-deploy.yml` on a push to the connected branch, so
# this file must keep exactly that name. PR runs cannot use the exchange (the
# platform rejects pull_request events, which run untrusted code) and
# authenticate with the VOID_TOKEN secret instead.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs can't read VOID_TOKEN; they still get ci.yml (typecheck + test).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Actions are pinned to a full commit SHA (org policy); kept in sync with ci.yml.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every run deploys to the shared staging project and smoke-tests the
      # REAL Void runtime, which catches platform-only failures the
      # pool-workers unit tests can't (e.g. the Void Cache API ban that 500'd
      # every packument) BEFORE the change reaches main or production. On push
      # this doubles as the staging-first gate: a change can reach main without
      # PR CI (a fork PR, or a direct push), so production only ships when
      # staging passes.
      #
      # Two steps because the auth differs by event (see the permissions
      # comment): PRs use the VOID_TOKEN secret, push/dispatch use OIDC.
      - name: Deploy to staging (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm exec void deploy --project pkg-pr-registry-bridge-staging
        env:
          VOID_TOKEN: ${{ secrets.VOID_TOKEN }}

      - name: Deploy to staging (OIDC)
        if: github.event_name != 'pull_request'
        run: pnpm exec void deploy --project pkg-pr-registry-bridge-staging

      # --write runs the admin write lifecycle too (see scripts/smoke-test.mjs
      # header); staging only, production smoke below stays read-only.
      - name: Smoke-test staging
        run: node scripts/smoke-test.mjs https://pkg-pr-registry-bridge-staging.void.app --write
        env:
          SMOKE_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}

      # Production ships only outside PRs (push to main, or a manual dispatch
      # for redeploys), and only after the staging smoke above passed.
      - name: Deploy to production
        if: github.event_name != 'pull_request'
        run: pnpm exec void deploy
        env:
          # VOID_PROJECT is required because the project link in `.void/` is
          # gitignored, so there is nothing to resolve from in CI. The OIDC
          # exchange also scopes the deploy token to this slug.
          VOID_PROJECT: pkg-pr-registry-bridge

      # No --write: read-only against the live bridge.
      - name: Smoke-test production
        if: github.event_name != 'pull_request'
        run: node scripts/smoke-test.mjs https://registry-bridge.viteplus.dev
