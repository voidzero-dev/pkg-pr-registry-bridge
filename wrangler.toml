name = "pkg-pr-registry-bridge"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Custom domain. The `render.vip` zone must be on this Cloudflare account;
# wrangler provisions the DNS record and TLS cert automatically.
routes = [{ pattern = "pkg-pr-registry-bridge.render.vip", custom_domain = true }]

[vars]
# Public origin of this bridge. Must match the deployed route so generated
# `dist.tarball` URLs are correct. Override per environment.
PUBLIC_BASE_URL = "https://pkg-pr-registry-bridge.render.vip"
NPM_REGISTRY = "https://registry.npmjs.org"
PKG_PR_NEW_BASE = "https://pkg.pr.new"
PREVIEW_OWNER = "voidzero-dev"
PREVIEW_REPO = "vite-plus"
# Comma-separated preview refs to inject into packuments: `pr.<n>` / `commit.<sha>`.
# Empty by default; configure per deployment (MVP2 moves this to KV).
VITE_PLUS_PREVIEW_REFS = "commit.6acea1aa818e96365b5811d47360367ba18a3a05,pr.1891"
# Max upstream tarball size (bytes). 64 MiB default; see RFC section 7.2.
MAX_TARBALL_BYTES = "67108864"

# Durable cache for generated tarballs and rewritten package.json metadata.
[[r2_buckets]]
binding = "TARBALL_CACHE"
bucket_name = "pkg-pr-registry-bridge-tarballs"

# Dynamic preview-ref registry: refs added via POST /-/refs (no redeploy).
[[kv_namespaces]]
binding = "PREVIEW_REFS"
id = "e8473fe4e0674f27a62399028a6604fd"

# Secrets (set with `wrangler secret put`, not here):
#   ADMIN_TOKEN           - bearer token guarding /-/refs and /-/purge
#   GITHUB_TOKEN          - optional, PR/commit existence checks on /-/refs
#   GITHUB_WEBHOOK_SECRET - optional, HMAC secret for the /-/webhook receiver
