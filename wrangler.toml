name = "pkg-pr-registry-bridge"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Custom domain. The `render.vip` zone must be on this Cloudflare account;
# wrangler provisions the DNS record and TLS cert automatically.
routes = [{ pattern = "pkg-pr-registry-bridge.render.vip", custom_domain = true }]

[observability.logs]
enabled = true
invocation_logs = true

[vars]
# Public origin of this bridge. Must match the deployed route so generated
# `dist.tarball` URLs are correct. Override per environment.
PUBLIC_BASE_URL = "https://pkg-pr-registry-bridge.render.vip"
NPM_REGISTRY = "https://registry.npmjs.org"
PKG_PR_NEW_BASE = "https://pkg.pr.new"
PREVIEW_OWNER = "voidzero-dev"
PREVIEW_REPO = "vite-plus"
# Comma-separated commit refs to inject into packuments: `commit.<sha>`.
# Only immutable commit builds are supported (PR-number refs are rejected).
VITE_PLUS_PREVIEW_REFS = "commit.6acea1aa818e96365b5811d47360367ba18a3a05"
# Packages the tarball endpoint serves and whose pkg.pr.new dependency URLs are
# routed through the bridge. Exact names or `prefix*` patterns. Add new
# workspace packages here (config-only, no code change).
WORKSPACE_PACKAGES = "vite-plus,@voidzero-dev/vite-plus-*"
# Max upstream tarball size (bytes). 64 MiB default; see RFC section 7.2.
MAX_TARBALL_BYTES = "67108864"

# Durable cache for generated tarballs and rewritten package.json metadata.
# A 90-day expiry lifecycle rule bounds storage growth (lifecycle rules live on
# the bucket, not here):
#   wrangler r2 bucket lifecycle add pkg-pr-registry-bridge-tarballs expire-90d \
#     --expire-days 90
[[r2_buckets]]
binding = "TARBALL_CACHE"
bucket_name = "pkg-pr-registry-bridge-tarballs"

# Secrets (set with `wrangler secret put`, not here):
#   ADMIN_TOKEN  - bearer token guarding the admin endpoints (/-/refs, /-/purge,
#                  /-/publish, /-/tarball)
#   GITHUB_TOKEN - optional, PR/commit existence checks on /-/refs
